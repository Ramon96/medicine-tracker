name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Lifted to job level so the steps below can test whether signing is configured.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle prints compiler errors thousands of lines before the failure summary, which
      # makes a failed run painful to read. Re-print just the errors at the very end.
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee gradle-tests.log || {
            echo "::group::Compiler errors"
            grep -E '^e: |FAILED$|^\* What went wrong:' -A2 gradle-tests.log | head -100
            echo "::endgroup::"
            exit 1
          }

      # Signing is optional: without the secrets the workflow still produces a debug-signed
      # APK, so a fresh clone builds green before any keystore exists.
      - name: Decode keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/keystore.jks"
          echo "KEYSTORE_FILE=keystore.jks" >> "$GITHUB_ENV"

      # Gradle reports a bad password or a missing alias from deep inside the packaging task,
      # with a message that names neither. Fail here instead, where we can say which of the
      # four secrets is wrong.
      - name: Check keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          KS="$GITHUB_WORKSPACE/keystore.jks"
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > /tmp/keystore-list.txt 2>&1; then
            echo "::error::Could not open the keystore. Either KEYSTORE_PASSWORD is wrong, or KEYSTORE_BASE64 was pasted with line breaks and decoded to a corrupt file."
            sed 's/^/  /' /tmp/keystore-list.txt | head -5
            exit 1
          fi
          if ! grep -qiE "^${KEY_ALIAS}," /tmp/keystore-list.txt; then
            echo "::error::The keystore opened fine, but has no alias named '${KEY_ALIAS}'. Set KEY_ALIAS to one of these:"
            grep -iE 'PrivateKeyEntry' /tmp/keystore-list.txt | cut -d, -f1 | sed 's/^/  /'
            exit 1
          fi
          echo "Keystore opens and contains the alias '${KEY_ALIAS}'."

      # On a v* tag the APK carries that version, so the in-app updater can tell it apart from
      # what is already installed. Untagged builds keep the 1.0.0 default.
      - name: Build release APK
        run: |
          set -o pipefail
          VERSION_ARG=""
          case "${{ github.ref }}" in
            refs/tags/v*) VERSION_ARG="-PappVersionName=${{ github.ref_name }}" ;;
          esac
          ./gradlew assembleRelease $VERSION_ARG --console=plain 2>&1 | tee gradle-release.log || {
            echo "::group::Compiler errors"
            grep -E '^e: |FAILED$|^\* What went wrong:' -A2 gradle-release.log | head -100
            echo "::endgroup::"
            exit 1
          }

      # A missing or misnamed secret still produces a perfectly good APK - just one signed with a
      # throwaway debug key, which silently cannot update the previous install. Printing the
      # certificate makes that visible in the log instead of only on the phone.
      - name: Verify signing
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          echo "APK: $APK"
          echo "::group::Signing certificate"
          keytool -printcert -jarfile "$APK" | grep -E 'Owner:|Valid from:|SHA256:' || {
            echo "::error::The APK carries no readable signing certificate."
            exit 1
          }
          echo "::endgroup::"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signed with the debug key because KEYSTORE_BASE64 is not set. \
          This APK cannot install over an existing installation, so in-app updates will not work."
          else
            echo "Signed with the configured release keystore."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medicijntracker-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
